name: Package Mods

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Package and release each mod
        run: |
          set -e
          for dir in */; do
            mod_name="${dir%/}"
            if [[ ! -d "$mod_name" || "$mod_name" == .* || "$mod_name" == "node_modules" || "$mod_name" == "venv" ]]; then
              continue
            fi
            if [[ -z "$(find "$mod_name" -type f -print -quit)" ]]; then
              echo "Skipping empty folder: $mod_name"
              continue
            fi
            echo "Processing $mod_name"
            (cd "$mod_name" && zip -r "../${mod_name}.zip" . -x "README.md" -x "zapret-hub-mod.json" -x "mod.json")
            if [[ -f "$mod_name/zapret-hub-mod.json" ]]; then
              (cd "$mod_name" && zip -r "../${mod_name}_hub.zip" . -x "README.md")
            fi
            if [[ -f "$mod_name/mod.json" ]]; then
              (cd "$mod_name" && zip -r "../${mod_name}_zen.zip" . -x "README.md" -x "zapret-hub-mod.json")
            fi
            if gh release view "$mod_name" >/dev/null 2>&1; then
              echo "Release $mod_name already exists, will update asset"
            else
              echo "Creating new release $mod_name"
              notes=""
              if [[ -f "$mod_name/README.md" ]]; then
                notes=$(cat "$mod_name/README.md")
              else
                notes="$mod_name"
              fi
              gh release create "$mod_name" \
                --title "$mod_name" \
                --notes "$notes"
            fi
            if [[ -f "$mod_name/README.md" ]]; then
              gh release edit "$mod_name" --notes-file "$mod_name/README.md"
            fi
            assets=("$mod_name.zip")
            if [[ -f "${mod_name}_hub.zip" ]]; then
              assets+=("${mod_name}_hub.zip")
            fi
            if [[ -f "${mod_name}_zen.zip" ]]; then
              assets+=("${mod_name}_zen.zip")
            fi
            gh release upload "$mod_name" "${assets[@]}" --clobber
            rm "${assets[@]}"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}